<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fasti for Mac</title>
  <meta name="description" content="A Mac app with a timeline above a task board. Each task shows when it’s due and whether it’s to do, in progress or done.">
  <meta name="theme-color" content="#ebebe8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://dennisgrellmann.github.io/fasti/">
  <meta property="og:title" content="Fasti for Mac">
  <meta property="og:description" content="A timeline above a task board, in one Mac app.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dennisgrellmann.github.io/fasti/">
  <meta property="og:locale" content="en_AU">
  <meta property="og:image" content="https://dennisgrellmann.github.io/fasti/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Fasti for Mac beside the app's timeline and board">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/img/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/IBMPlexMono-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/IBMPlexMono-Medium-Latin1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <main class="wrap">
    <h1>Fasti</h1>
    <p>A timeline above a task board, for the Mac. Each task shows when it’s due and whether it’s to do, in progress or done.</p>

    <figure class="shot">
      <picture>
        <source media="(prefers-color-scheme: dark)" type="image/avif" srcset="assets/img/shots/board-dark-1280.avif 1280w, assets/img/shots/board-dark-2560.avif 2560w" sizes="(min-width: 1120px) 1056px, calc(100vw - 32px)">
        <source media="(prefers-color-scheme: dark)" srcset="assets/img/shots/board-dark-1280.png">
        <source type="image/avif" srcset="assets/img/shots/board-light-1280.avif 1280w, assets/img/shots/board-light-2560.avif 2560w" sizes="(min-width: 1120px) 1056px, calc(100vw - 32px)">
        <img src="assets/img/shots/board-light-1280.png" width="1280" height="820" fetchpriority="high"
             alt="The Fasti window: a timeline of tasks above To Do, In Progress and Done columns of cards.">
      </picture>
      <figcaption>Sample data</figcaption>
    </figure>

    <p class="muted">macOS 14 or later. Not available yet.</p>
  </main>
</body>
</html>
