<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fasti for Mac</title>
  <meta name="description" content="A Mac app with a timeline above a task board. Each task shows when it’s due and whether it’s to do, in progress or done.">
  <meta name="theme-color" content="#ebebe8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://dennisgrellmann.github.io/fasti/">
  <meta property="og:title" content="Fasti for Mac">
  <meta property="og:description" content="A timeline above a task board, in one Mac app.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dennisgrellmann.github.io/fasti/">
  <meta property="og:locale" content="en_AU">
  <meta property="og:image" content="https://dennisgrellmann.github.io/fasti/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Fasti for Mac beside the app's timeline and board">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/img/favicon-64.png?v=2">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=2">
  <link rel="preload" href="assets/fonts/IBMPlexMono-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/IBMPlexMono-Medium-Latin1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>Fasti</h1>
      <p class="tagline">Your to-do on a timeline.</p>
      <div class="burst">
        <div class="ring" aria-hidden="true">
          <span class="mini" style="--a: 0deg; --t: -8deg; --c: var(--lavender)"></span>
          <span class="mini" style="--a: 40deg; --t: 12deg; --c: var(--mint)"></span>
          <span class="mini" style="--a: 80deg; --t: -14deg; --c: var(--peach)"></span>
          <span class="mini" style="--a: 118deg; --t: 6deg; --c: var(--blue)"></span>
          <span class="mini" style="--a: 160deg; --t: -10deg; --c: var(--coral)"></span>
          <span class="mini" style="--a: 200deg; --t: 14deg; --c: var(--lavender)"></span>
          <span class="mini" style="--a: 240deg; --t: -6deg; --c: var(--mint)"></span>
          <span class="mini" style="--a: 282deg; --t: 10deg; --c: var(--blue)"></span>
          <span class="mini" style="--a: 322deg; --t: -12deg; --c: var(--peach)"></span>
        </div>
        <picture>
          <source type="image/webp" srcset="assets/img/marcus.webp">
          <img class="icon" src="assets/img/marcus.png" width="480" height="480" alt="Pixel-art portrait of Marcus Aurelius in a purple cloak, with ruined temples behind him.">
        </picture>
      </div>
    </header>

    <section class="get" aria-label="Download">
      <div class="buttons">
        <a class="button prominent large" role="link" aria-disabled="true">Download for macOS</a>
        <a class="button large" href="https://github.com/DennisGrellmann/Fasti-Desktop-Mac">View on GitHub</a>
      </div>
      <p class="muted">macOS 14 or later. Not available yet.</p>
      <p class="muted">Open source, under the <a href="https://github.com/DennisGrellmann/Fasti-Desktop-Mac/blob/main/LICENSE">GPL-3.0 licence</a>.</p>
    </section>

    <figure class="shot">
      <picture>
        <source media="(prefers-color-scheme: dark)" type="image/avif" srcset="assets/img/shots/board-dark-1280.avif 1280w, assets/img/shots/board-dark-2560.avif 2560w" sizes="(min-width: 1120px) 1056px, calc(100vw - 32px)">
        <source media="(prefers-color-scheme: dark)" srcset="assets/img/shots/board-dark-1280.png">
        <source type="image/avif" srcset="assets/img/shots/board-light-1280.avif 1280w, assets/img/shots/board-light-2560.avif 2560w" sizes="(min-width: 1120px) 1056px, calc(100vw - 32px)">
        <img src="assets/img/shots/board-light-1280.png" width="1280" height="820" loading="lazy"
             alt="The Fasti window: a timeline of tasks above To Do, In Progress and Done columns of cards.">
      </picture>
    </figure>
  </main>
</body>
</html>
