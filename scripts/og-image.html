<!doctype html>
<!-- Source for assets/img/og-image.png (1200 × 630), the link preview image.
     Rebuild: swift scripts/snapshot.swift http://127.0.0.1:8765/scripts/og-image.html 1200 og@2x.png light 630
     then: sips -z 630 1200 og@2x.png --out assets/img/og-image.png
     The screenshot is a real capture, only scaled and cropped by the frame. -->
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>Fasti share image</title>
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    :root { color-scheme: light; --paper: #ebebe8; --board: #e3e3e0; --card: #f5f5f3; --bar: #c8c8c5; --ink: #1c1c1c; --muted: #595957; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); }
    .bar { display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 56px; border-bottom: 1px solid var(--ink); }
    .bar .wordmark { font-size: 20px; margin: 0; }
    .bar .eyebrow { margin: 0; font-size: 14px; }
    .copy { position: absolute; left: 56px; top: 128px; width: 470px; }
    .copy h1 { font-size: 40px; line-height: 1.25; letter-spacing: 0.12em; }
    .copy p { margin: 28px 0 0; color: var(--muted); font-size: 17px; line-height: 1.55; }
    .frame { position: absolute; left: 580px; top: 128px; width: 1040px; border: 1px solid var(--ink); background: var(--card); }
    /* Crop past the window's rounded corner so the frame stays square. */
    .frame { overflow: hidden; }
    .frame img { width: 1060px; max-width: none; margin: -10px 0 0 -10px; }
  </style>
</head>
<body>
  <div class="bar"><p class="wordmark">Fasti</p><p class="eyebrow">For Mac · macOS 14 or later</p></div>
  <div class="copy">
    <h1>See when work is due and where it stands.</h1>
    <p>A timeline above a task board, in one native Mac app.</p>
  </div>
  <div class="frame"><img src="../assets/img/shots/board-light-2560.avif" width="2560" height="1640" alt=""></div>
</body>
</html>
